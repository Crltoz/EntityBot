name: Trigger auto deployment for entitybot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-entitybot
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ENTITYBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ENTITYBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ENTITYBOT_AZURE_SUBSCRIPTION_ID }}

      # Builds the image with the Container Apps managed builder (no registry of
      # our own is involved) and rolls out a new revision of the existing app.
      - name: Build from source and deploy revision
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az extension add --name containerapp --upgrade --allow-preview true --yes
            az containerapp update \
              --name entitybot \
              --resource-group DefaultResourceGroup-EUS2 \
              --source .
