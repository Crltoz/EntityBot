name: Trigger auto deployment for entitybot

on:
  push:
    branches: [ main ]
  workflow_dispatch:

concurrency:
  group: deploy-entitybot
  cancel-in-progress: false

env:
  # GHCR rejects uppercase paths, so this is spelled out rather than derived
  # from github.repository_owner.
  IMAGE: ghcr.io/crltoz/entitybot

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write #This is required for requesting the OIDC JWT Token
      contents: read
      packages: write #Required to push the image to GHCR

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.sha }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.ENTITYBOT_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.ENTITYBOT_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.ENTITYBOT_AZURE_SUBSCRIPTION_ID }}

      - name: Roll out new revision
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az config set extension.use_dynamic_install=yes_without_prompt
            az extension add --name containerapp --upgrade --yes
            az containerapp update \
              --name entitybot \
              --resource-group DefaultResourceGroup-EUS2 \
              --image ${{ env.IMAGE }}:${{ github.sha }}
